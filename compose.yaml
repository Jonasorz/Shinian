services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shinian
      POSTGRES_USER: shinian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - shinian_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinian -d shinian"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  shinian_postgres:
